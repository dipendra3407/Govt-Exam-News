<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Govt Exam News</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f9;
  color:#222;
}
header{
  background:#123b72;
  color:white;
  padding:18px 15px;
  text-align:center;
}
header h1{margin:0;font-size:26px}
header p{margin:6px 0 0}

nav{
  background:white;
  padding:12px;
  text-align:center;
  box-shadow:0 2px 8px #ddd;
}
nav button{
  margin:4px;
  padding:9px 15px;
  border:0;
  border-radius:20px;
  background:#e9eef7;
  cursor:pointer;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.search{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:8px;
  margin-bottom:15px;
}

.news{
  background:white;
  margin-bottom:15px;
  padding:17px;
  border-radius:10px;
  box-shadow:0 2px 8px #ddd;
}
.news h2{
  margin:0 0 8px;
  color:#123b72;
  font-size:20px;
}
.news .date{
  color:#777;
  font-size:13px;
  margin-bottom:10px;
}

.admin{
  background:white;
  padding:18px;
  border-radius:10px;
  box-shadow:0 2px 8px #ddd;
  margin-top:20px;
}
input,textarea,select{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #ccc;
  border-radius:7px;
}
textarea{min-height:100px}

.btn{
  background:#123b72;
  color:white;
  border:0;
  padding:11px 18px;
  border-radius:7px;
  cursor:pointer;
}

footer{
  text-align:center;
  padding:25px;
  color:#777;
}
</style>
</head>

<body>

<header>
  <h1>📢 Govt Exam News</h1>
  <p>सरकारी नौकरी और परीक्षा की ताजा जानकारी</p>
</header>

<nav>
  <button onclick="filterNews('सभी')">सभी</button>
  <button onclick="filterNews('SSC')">SSC</button>
  <button onclick="filterNews('Railway')">Railway</button>
  <button onclick="filterNews('Rajasthan')">Rajasthan</button>
  <button onclick="filterNews('Other')">Other</button>
</nav>

<div class="container">

<input class="search" id="search"
placeholder="🔎 खबर खोजें..."
oninput="showNews()">

<div id="newsList">
  <div class="news">
    <h2>Govt Exam News में आपका स्वागत है</h2>
    <div class="date">आज</div>
    <p>सरकारी परीक्षाओं से जुड़ी नवीनतम जानकारी यहाँ प्रकाशित की जाएगी।</p>
  </div>
</div>

<div class="admin">
<h2>📝 News Add करें</h2>

<input id="title" placeholder="News का Title">

<select id="category">
<option value="SSC">SSC</option>
<option value="Railway">Railway</option>
<option value="Rajasthan">Rajasthan</option>
<option value="Other">Other</option>
</select>

<textarea id="description"
placeholder="News की पूरी जानकारी लिखें"></textarea>

<button class="btn" onclick="addNews()">News Publish करें</button>
</div>

</div>

<footer>
© 2026 Govt Exam News
</footer>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyDshmSsDYybUpBs2-UvfU7BTYDLJaMgvdY",
  authDomain: "govt-exam-news-1beb1.firebaseapp.com",
  projectId: "govt-exam-news-1beb1",
  storageBucket: "govt-exam-news-1beb1.firebasestorage.app",
  messagingSenderId: "63843622878",
  appId: "1:63843622878:web:7e8c51db8453f0741f474f",
  measurementId: "G-ZTQSLWPWHH"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allNews = [];
let currentCategory = "सभी";

async function loadNews(){

  try{

    const snapshot = await getDocs(collection(db,"news"));

    allNews = [];

    snapshot.forEach(doc => {
      allNews.push({
        id:doc.id,
        ...doc.data()
      });
    });

    showNews();

  }catch(error){
    console.log(error);
  }
}


window.addNews = async function(){

  const title = document.getElementById("title").value.trim();
  const category = document.getElementById("category").value;
  const description = document.getElementById("description").value.trim();

  if(!title || !description){
    alert("Title और News की जानकारी भरें");
    return;
  }

  try{

    await addDoc(collection(db,"news"),{
      title:title,
      category:category,
      description:description,
      createdAt:serverTimestamp()
    });

    alert("✅ News successfully publish हो गई!");

    document.getElementById("title").value="";
    document.getElementById("description").value="";

    loadNews();

  }catch(error){

    alert("News publish नहीं हुई। Firebase Rules check करें।");
    console.log(error);

  }
}


window.filterNews = function(category){

  currentCategory = category;
  showNews();

}


window.showNews = function(){

  const search =
    document.getElementById("search").value.toLowerCase();

  const list =
    document.getElementById("newsList");

  list.innerHTML="";

  let filtered = allNews.filter(n => {

    const matchCategory =
      currentCategory === "सभी" ||
      n.category === currentCategory;

    const matchSearch =
      (n.title || "").toLowerCase().includes(search) ||
      (n.description || "").toLowerCase().includes(search);

    return matchCategory && matchSearch;

  });

  if(filtered.length === 0){

    list.innerHTML = `
      <div class="news">
        <h2>कोई News नहीं मिली</h2>
      </div>
    `;

    return;
  }

  filtered.forEach(n => {

    list.innerHTML += `
      <div class="news">
        <h2>${n.title}</h2>
        <div class="date">${n.category}</div>
        <p>${n.description}</p>
      </div>
    `;

  });

}


loadNews();

</script>

</body>
  </html>
